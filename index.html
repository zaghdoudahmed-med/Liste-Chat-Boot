<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --accent: #f59e0b;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', 'Inter', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: all 0.3s ease;
  }
  
  /* Header */
  header {
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    color: white;
    padding: 40px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
    animation: pulse 10s infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  
  .lang-switcher {
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    gap: 8px;
    z-index: 20;
  }
  html[dir="ltr"] .lang-switcher { left: auto; right: 20px; }
  .lang-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: 0.3s;
    backdrop-filter: blur(5px);
  }
  .lang-btn:hover, .lang-btn.active { background: white; color: var(--primary); }

  .basmala { font-size: 1.3rem; margin-bottom: 15px; opacity: 0.9; font-weight: 300; }
  header h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; position: relative; }
  .creator-badge {
    display: inline-block;
    background: var(--accent);
    color: #1e293b;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1rem;
    margin-top: 15px;
    box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
  }

  /* Layout */
  .main-layout {
    display: flex;
    gap: 30px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    align-items: flex-start;
  }

  .sidebar {
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
    background: var(--card-bg);
    padding: 24px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }

  .sidebar-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
  }

  .search-box {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: 0.3s;
    margin-bottom: 20px;
    background: var(--bg);
  }
  .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); background: white; }
  
  .filters {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    padding-right: 5px;
  }
  .filters::-webkit-scrollbar { width: 4px; }
  .filters::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  
  .filter-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    text-align: start;
    transition: 0.2s;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .filter-btn:hover { background: var(--bg); color: var(--primary); }
  .filter-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }

  .content-area { flex: 1; min-width: 0; }

  /* Grid & Cards */
  .category-section { margin-bottom: 40px; display: none; }
  .category-section.active { display: block; }
  .category-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 20px;
    padding-right: 15px;
    border-right: 4px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  html[dir="ltr"] .category-title { padding-right: 0; padding-left: 15px; border-right: none; border-left: 4px solid var(--accent); }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 20px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transform: scaleX(0);
    transition: transform 0.3s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); border-color: var(--primary); }
  .card:hover::before { transform: scaleX(1); }
  
  .card-logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    object-fit: contain;
    background: #f8fafc;
    padding: 8px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    transition: 0.3s;
  }
  .card:hover .card-logo { transform: scale(1.1); border-color: var(--primary); }
  
  .card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
  .card p { font-size: 0.85rem; color: var(--text-light); line-height: 1.5; }
  
  .tag {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #dbeafe;
    color: var(--primary-dark);
    font-size: 0.7rem;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 700;
  }
  html[dir="ltr"] .tag { right: auto; left: 12px; }
  .tag.paid { background: #fef3c7; color: #92400e; }
  .tag.free { background: #dcfce7; color: #166534; }
  .tag.expert { background: #f3e8ff; color: #6b21a8; }

  .rank-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(255, 215, 0, 0.2);
    color: #854d0e;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 800;
    border: 1px solid rgba(255, 215, 0, 0.5);
  }
  html[dir="ltr"] .rank-badge { left: auto; right: 12px; }

  /* Important Notes Section */
  .notes-section {
    background: #fffbeb;
    border: 1px solid #fcd34d;
    border-radius: 16px;
    padding: 30px;
    margin-top: 40px;
  }
  .notes-section h3 { color: #92400e; font-size: 1.3rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .notes-section ul { list-style: none; padding: 0; }
  .notes-section li {
    margin-bottom: 15px;
    padding-right: 20px;
    position: relative;
    color: #78350f;
    line-height: 1.6;
  }
  html[dir="ltr"] .notes-section li { padding-right: 0; padding-left: 20px; }
  .notes-section li::before {
    content: '⚠️';
    position: absolute;
    right: 0;
    top: 2px;
  }
  html[dir="ltr"] .notes-section li::before { right: auto; left: 0; }

  /* Footer */
  footer {
    background: #0f172a;
    color: #94a3b8;
    text-align: center;
    padding: 40px 20px;
    margin-top: 60px;
  }
  footer .creator { color: white; font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }

  @media (max-width: 900px) {
    .main-layout { flex-direction: column; padding-top: 20px; }
    .sidebar { width: 100%; position: static; max-height: none; padding: 20px; }
    .filters { flex-direction: row; overflow-x: auto; padding-bottom: 10px; }
    .filter-btn { width: auto; white-space: nowrap; flex-shrink: 0; }
    header h1 { font-size: 1.6rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>

let currentLang = 'ar';
let currentFilter = 'all';

function setLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === lang);
  });

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) el.textContent = translations[lang][key];
  });
  
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (translations[lang][key]) el.placeholder = translations[lang][key];
  });

  renderTools();
}

function renderTools() {
  const container = document.getElementById('contentContainer');
  const searchQuery = document.getElementById('searchInput').value.toLowerCase();
  container.innerHTML = '';
  
  const filteredData = toolsData.filter(tool => {
    const tags = tool.tags || '';
    let matchesFilter = false;
    
    if (currentFilter === 'all') matchesFilter = true;
    else if (currentFilter === 'classement') matchesFilter = tool.rank !== undefined;
    else if (['popular', 'free', 'code', 'image'].includes(currentFilter)) matchesFilter = tags.includes(currentFilter);
    else matchesFilter = tool.cat === currentFilter;
    
    const matchesSearch = tool.name.toLowerCase().includes(searchQuery) || 
                          tool.desc[currentLang].toLowerCase().includes(searchQuery);
    return matchesFilter && matchesSearch;
  });

  const grouped = {};
  filteredData.forEach(tool => {
    if (!grouped[tool.cat]) grouped[tool.cat] = [];
    grouped[tool.cat].push(tool);
  });

  if (Object.keys(grouped).length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b; font-size:1.2rem;">${currentLang === 'ar' ? 'لا توجد نتائج مطابقة' : (currentLang === 'fr' ? 'Aucun résultat trouvé' : 'No results found')} 🔍</div>`;
    return;
  }

  const categories = {
    'llm': { ar: '🧠 النماذج اللغوية والمساعدون الأذكياء', fr: '🧠 Modèles Linguistiques et Assistants', en: '🧠 Language Models & Assistants' },
    'opensource': { ar: '📦 النماذج المفتوحة ومكتبات النماذج', fr: '📦 Modèles Open Source et Bibliothèques', en: '📦 Open-Weight & Open-Source Models' },
    'research': { ar: '🔬 البحث العلمي والأكاديمي', fr: '🔬 Recherche Scientifique et Académique', en: '🔬 AI Academic Research' },
    'pdf': { ar: '📄 تحليل ملفات PDF والمستندات', fr: '📄 Analyse de PDF et Documents', en: '📄 Document AI & PDF Analysis' },
    'code': { ar: '💻 البرمجة وتطوير التطبيقات', fr: '💻 Programmation et Développement', en: '💻 AI Coding & Software Development' },
    'image': { ar: '🎨 توليد الصور والتصميم', fr: '🎨 Génération d\'Images et Design', en: '🎨 AI Image Generation' },
    'video': { ar: '🎬 الفيديو والأنيميشن', fr: '🎬 Vidéo et Animation', en: '🎬 AI Video Generation' },
    'audio': { ar: '🎙️ الصوت، التحدث والموسيقى', fr: '🎙️ Audio, Voix et Musique', en: '🎙️ AI Audio & Music' },
    'edu': { ar: '🎓 التعليم والتدريس والتقييم', fr: '🎓 Éducation, Enseignement et Évaluation', en: '🎓 AI Education' },
    'write': { ar: '✍️ الترجمة، التدقيق وإعادة الصياغة', fr: '✍️ Traduction, Correction et Reformulation', en: '✍️ AI Writing & Translation' },
    'office': { ar: '📊 العروض التقديمية والتصميم المكتبي', fr: '📊 Présentations et Travail de Bureau', en: '📊 AI Presentations & Office' },
    'data': { ar: '📈 تحليل البيانات والإحصاء والتصور', fr: '📈 Science des Données et Visualisation', en: '📈 AI Data Science' },
    'agents': { ar: '🤖 الأتمتة والوكلاء الأذكياء', fr: '🤖 Automatisation et Agents Intelligents', en: '🤖 AI Agents & Automation' },
    '3d': { ar: '🧊 التصميم ثلاثي الأبعاد والهندسة', fr: '🧊 Design 3D et Ingénierie', en: '🧊 AI 3D & Engineering' },
    'meetings': { ar: '📝 الاجتماعات وتسجيل الملاحظات', fr: '📝 Réunions et Prise de Notes', en: '📝 AI Meetings & Transcription' },
    'marketing': { ar: '📢 التسويق وإدارة المحتوى', fr: '📢 Marketing et Gestion de Contenu', en: '📢 AI Marketing & Content' },
    'nocode': { ar: '🛠️ إنشاء المواقع والتطبيقات بدون برمجة', fr: '🛠️ Création de Sites et Apps No-Code', en: '🛠️ No-Code & AI App Builders' },
    'science': { ar: '🔭 الرياضيات والعلوم والبحث التقني', fr: '🔭 Mathématiques, Sciences et Recherche', en: '🔭 Scientific & Mathematical AI' },
    'security': { ar: '🛡️ الأمن السيبراني وتحليل البرمجيات', fr: '🛡️ Cybersécurité et Analyse Logicielle', en: '🛡️ AI Cybersecurity' },
    'productivity': { ar: '⚡ إدارة المشاريع والإنتاجية والمعرفة', fr: '⚡ Gestion de Projet et Productivité', en: '⚡ AI Productivity & Project Management' },
    'guides': { ar: '📚 أدلة إضافية للعثور على نماذج جديدة', fr: '📚 Guides Supplémentaires pour Nouveaux Modèles', en: '📚 Additional Guides for New Models' }
  };

  for (const [cat, tools] of Object.entries(grouped)) {
    const section = document.createElement('div');
    section.className = 'category-section active';
    
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = categories[cat] ? categories[cat][currentLang] : cat;
    section.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    tools.forEach(tool => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = tool.url;
      card.target = '_blank';
      
      const tagText = translations[currentLang][`tag_${tool.tag}`] || tool.tag;
      const logoUrl = `https://www.google.com/s2/favicons?domain=${tool.domain}&sz=128`;
      
      let medal = '';
      if (tool.rank === 1) medal = '🥇 #1';
      else if (tool.rank === 2) medal = '🥈 #2';
      else if (tool.rank === 3) medal = '🥉 #3';
      const rankBadgeHTML = medal ? `<div class="rank-badge">${medal}</div>` : '';

      card.innerHTML = `
        ${rankBadgeHTML}
        <span class="tag ${tool.tag}">${tagText}</span>
        <img src="${logoUrl}" alt="${tool.name}" class="card-logo" onerror="this.src='https://via.placeholder.com/64?text=AI'">
        <h3>${tool.name}</h3>

        <li><strong>${currentLang === 'ar' ? 'النماذج المفتوحة' : (currentLang === 'fr' ? 'Modèles Ouverts' : 'Open Models')}:</strong> ${currentLang === 'ar' ? 'Open-weight لا تعني دائماً Open Source بالكامل؛ يجب التحقق من الترخيص.' : (currentLang === 'fr' ? 'Open-weight ne signifie pas toujours Open Source complet ; vérifiez la licence.' : 'Open-weight doesn\'t always mean fully Open Source; check the license.')}</li>
        <li><strong>${currentLang === 'ar' ? 'الأبحاث العلمية' : (currentLang === 'fr' ? 'Recherche Scientifique' : 'Scientific Research')}:</strong> ${currentLang === 'ar' ? 'لا تعتمد على المراجع التي يولدها أي مساعد قبل التحقق من DOI والناشر والمقال الأصلي.' : (currentLang === 'fr' ? 'Ne vous fiez pas aux références générées sans vérifier le DOI, l\'éditeur et l\'article original.' : 'Do not rely on generated references without verifying the DOI, publisher, and original paper.')}</li>
        <li><strong>${currentLang === 'ar' ? 'الخصوصية' : (currentLang === 'fr' ? 'Confidentialité' : 'Privacy')}:</strong> ${currentLang === 'ar' ? 'لا ترفع بيانات المرضى أو المعلومات البحثية السرية إلى منصات عامة دون التأكد من شروط الخصوصية.' : (currentLang === 'fr' ? 'Ne téléchargez pas de données sensibles ou de recherche secrète sur des plateformes publiques sans vérifier les conditions de confidentialité.' : 'Do not upload sensitive patient data or secret research info to public platforms without checking privacy terms.')}</li>
        <li><strong>${currentLang === 'ar' ? 'المقارنة العلمية' : (currentLang === 'fr' ? 'Comparaison Scientifique' : 'Scientific Comparison')}:</strong> ${currentLang === 'ar' ? 'لا تقارن النماذج اعتماداً على الدعاية فقط؛ استخدم Benchmarks وقياسات موحدة.' : (currentLang === 'fr' ? 'Ne comparez pas les modèles uniquement sur la base du marketing ; utilisez des benchmarks et des mesures standardisées.' : 'Do not compare models based on marketing alone; use standardized benchmarks and metrics.')}</li>
      </ul>
    `;
    container.appendChild(notesSection);
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTools();
  });
});

document.getElementById('searchInput').addEventListener('input', () => {
  renderTools();
});

setLanguage('ar');
</script>
